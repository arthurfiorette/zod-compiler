jobs:
  release:
    environment: release
    name: Release
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: setup repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      # build before lint and test: #src imports resolve to dist/ — type-aware
      # lint reads dist/ types, and test discovery executes fixtures through
      # jiti, which resolves #src to dist/ at runtime.
      - run: vp pack
      - run: vp check
      - run: vp exec knip
      - run: vp test
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vp exec semantic-release
    timeout-minutes: 30
name: Release
on:
  push:
    branches:
      - main
