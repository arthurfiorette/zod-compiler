jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: setup repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      # Build before tests: fixture modules self-import `zod-compiler`, whose
      # package exports resolve to dist when jiti executes them.
      - run: vp pack
      - run: vp check
      - run: vp exec knip
      - run: vp test
    timeout-minutes: 10
name: Test and build
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
