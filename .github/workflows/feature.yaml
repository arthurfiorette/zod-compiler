jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: setup repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      # build before lint and test: #src imports resolve to dist/ — type-aware
      # lint reads dist/ types, and test discovery executes fixtures through
      # jiti, which resolves #src to dist/ at runtime.
      - run: vp pack
      - run: vp check
      - run: vp run typecheck
      - run: vp exec knip
      - run: vp test
    timeout-minutes: 10
name: Test and build
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
